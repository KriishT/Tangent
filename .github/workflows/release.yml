# Build Windows + Mac installers on each version tag (with updater signatures).
# Creates a DRAFT GitHub Release — publish it so /releases/latest (and in-app updates) work.
#
# Secrets:
#   GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --features voice
          - platform: macos-latest
            args: --features voice

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Ensure Whisper model (bundled in installer)
        shell: bash
        run: bash scripts/ensure-whisper-model.sh

      - name: Build and draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          VITE_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Tangent ${{ github.ref_name }}
          releaseBody: |
            Includes in-app updater support.

            Unsigned OS installers — see [install instructions](https://github.com/${{ github.repository }}/blob/master/docs/releasing.md).

            **Windows:** SmartScreen may warn → More info → Run anyway.

            **Mac:** Open the `.dmg` → drag Tangent to Applications → **eject the disk image**.
            Then System Settings → Privacy & Security → **Open Anyway** if needed.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # tauri-action may skip uploading macOS .app.tar.gz; attach them explicitly for the updater.
      - name: Upload macOS updater bundles
        if: runner.os == 'macOS'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ls -la src-tauri/target/release/bundle/macos/ || true
          mapfile -t files < <(find src-tauri/target/release/bundle -type f \( -name '*.app.tar.gz' -o -name '*.app.tar.gz.sig' \) | sort)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No macOS updater artifacts found"
            exit 1
          fi
          printf 'Uploading:\n%s\n' "${files[@]}"
          gh release upload "${{ github.ref_name }}" "${files[@]}" --clobber

  finalize-updater-json:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Build combined latest.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/rel
          gh release download "$TAG" -D /tmp/rel -R "$GITHUB_REPOSITORY"
          ls -la /tmp/rel
          export PUB_DATE
          PUB_DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"

          python3 <<'PY'
          import json, os, pathlib

          tag = os.environ["TAG"]
          version = tag.lstrip("v")
          base = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{tag}"
          platforms = {}
          rel = pathlib.Path("/tmp/rel")

          def add(key: str, artifact_glob: str, sig_glob: str) -> None:
              arts = [p for p in sorted(rel.glob(artifact_glob)) if not p.name.endswith(".sig")]
              sigs = sorted(rel.glob(sig_glob))
              if not arts or not sigs:
                  print(f"skip {key}: arts={arts} sigs={sigs}")
                  return
              platforms[key] = {
                  "url": f"{base}/{arts[0].name}",
                  "signature": sigs[0].read_text(encoding="utf-8").strip(),
              }

          add("windows-x86_64", "*x64-setup.exe", "*x64-setup.exe.sig")
          add("windows-x86_64-nsis", "*x64-setup.exe", "*x64-setup.exe.sig")
          add("darwin-aarch64", "*.app.tar.gz", "*.app.tar.gz.sig")

          if "windows-x86_64" not in platforms:
              raise SystemExit("missing windows updater assets")

          data = {
              "version": version,
              "notes": "Tangent update",
              "pub_date": os.environ["PUB_DATE"],
              "platforms": platforms,
          }
          out = pathlib.Path("/tmp/latest.json")
          out.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          print(out.read_text())
          PY

          gh release upload "$TAG" /tmp/latest.json --clobber -R "$GITHUB_REPOSITORY"
