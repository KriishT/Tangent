# Build Windows + Mac installers on each version tag (with updater signatures).
# Creates a DRAFT GitHub Release — publish it so /releases/latest (and in-app updates) work.
#
# Secrets:
#   GOOGLE_OAUTH_CLIENT_ID, GOOGLE_OAUTH_CLIENT_SECRET
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --features voice
          - platform: macos-latest
            args: --features voice

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Set macOS deployment target
        if: runner.os == 'macOS'
        run: echo "MACOSX_DEPLOYMENT_TARGET=10.15" >> "$GITHUB_ENV"

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Ensure Whisper model (bundled in installer)
        shell: bash
        run: bash scripts/ensure-whisper-model.sh

      - name: Build and draft release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          VITE_GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Tangent ${{ github.ref_name }}
          releaseBody: |
            Includes in-app updater support.

            Unsigned OS installers — see [install instructions](https://github.com/${{ github.repository }}/blob/master/docs/releasing.md).

            **Windows:** SmartScreen may warn → More info → Run anyway.

            **Mac:** Open the `.dmg` → drag Tangent to Applications → **eject the disk image**.
            Then System Settings → Privacy & Security → **Open Anyway** if needed.
          releaseDraft: true
          prerelease: false
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # tauri-action sometimes uploads only the .dmg on macOS; updater needs .app.tar.gz + .sig.
      - name: Upload macOS updater bundles
        if: runner.os == 'macOS'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(src-tauri/target/release/bundle/macos/*.app.tar.gz src-tauri/target/release/bundle/macos/*.app.tar.gz.sig)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No macOS updater artifacts found"
            exit 1
          fi
          gh release upload "${{ github.ref_name }}" "${files[@]}" --clobber
